<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    {{header | safe}}  <!--to tell jinja header code is safe to parse -->

    <h1>Welcome back {{name}}!</h1>
    {% if name %}
        <h1>Hello {{ name }}!</h1>
    {% else %}
        <h1>Hello, Anonymous!</h1>
    {% endif %}

    <ol>
        {% for friend in friends %}
            <li>{{ friend }} </li>
        {% endfor %}
    </ol>
</body>
</html>
