<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialogue Summarizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0d0f;
            --surface: #16161a;
            --surface-alt: #1e1e24;
            --border: #2a2a35;
            --accent: #c8f542;
            --accent-dim: rgba(200, 245, 66, 0.12);
            --accent-glow: rgba(200, 245, 66, 0.25);
            --text-primary: #f0f0f5;
            --text-secondary: #8888aa;
            --text-muted: #555568;
            --radius: 12px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: 'DM Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 2rem 1rem 4rem;
            overflow-x: hidden;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(200, 245, 66, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200, 245, 66, 0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: -30%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(200, 245, 66, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: pulse 6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.6; transform: translateX(-50%) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* Header */
        .header {
            padding: 3rem 0 2rem;
            animation: fadeDown 0.7s ease both;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-dim);
            border: 1px solid rgba(200, 245, 66, 0.2);
            color: var(--accent);
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 100px;
            margin-bottom: 1.2rem;
        }

        .badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: blink 1.4s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2.2rem, 6vw, 3.5rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        h1 span {
            color: var(--accent);
        }

        .subtitle {
            font-size: 0.82rem;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            margin-top: 0.8rem;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, var(--accent) 0%, transparent 60%);
            margin-bottom: 2rem;
            opacity: 0.3;
            animation: fadeDown 0.7s 0.1s ease both;
        }

        /* Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            animation: fadeUp 0.6s ease both;
        }

        .card + .card {
            margin-top: 1rem;
        }

        .card-label {
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Textarea */
        textarea {
            width: 100%;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'DM Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            padding: 1rem;
            resize: vertical;
            min-height: 180px;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        textarea:focus {
            border-color: rgba(200, 245, 66, 0.4);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        /* Char counter */
        .char-counter {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 6px;
            transition: color var(--transition);
        }

        .char-counter.warn {
            color: #f5a623;
        }

        /* Button row */
        .button-row {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        button {
            cursor: pointer;
            font-family: 'DM Mono', monospace;
            font-size: 0.8rem;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.4rem;
            transition: all var(--transition);
            letter-spacing: 0.05em;
        }

        .btn-primary {
            background: var(--accent);
            color: #0d0d0f;
            flex: 1;
            min-width: 140px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            transition: opacity var(--transition);
        }

        .btn-primary:hover::before { opacity: 0.1; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px var(--accent-glow); }
        .btn-primary:active { transform: translateY(0); box-shadow: none; }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--text-muted);
            color: var(--text-primary);
        }

        /* Loading state */
        .btn-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(13, 13, 15, 0.3);
            border-top-color: #0d0d0f;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Output card */
        .output-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-top: 1rem;
            animation: fadeUp 0.5s ease both;
            display: none;
        }

        .output-card.visible {
            display: block;
        }

        .output-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.2rem;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
        }

        .output-title {
            font-family: 'Syne', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .output-title::before {
            content: '//';
            opacity: 0.5;
            font-family: 'DM Mono', monospace;
            font-weight: 300;
        }

        .copy-btn {
            font-family: 'DM Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            background: none;
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .copy-btn:hover {
            color: var(--accent);
            border-color: rgba(200, 245, 66, 0.3);
        }

        .output-body {
            padding: 1.4rem 1.5rem;
        }

        #summary-text {
            font-size: 0.9rem;
            line-height: 1.8;
            color: var(--text-primary);
            white-space: pre-wrap;
        }

        /* Typing animation for summary */
        .typing-cursor::after {
            content: '▋';
            color: var(--accent);
            animation: cursor-blink 0.8s step-end infinite;
        }

        @keyframes cursor-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .empty-icon {
            font-size: 2rem;
            opacity: 0.3;
            margin-bottom: 4px;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            gap: 1.5rem;
            padding: 0.75rem 1.5rem;
            border-top: 1px solid var(--border);
            background: var(--surface-alt);
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 0.82rem;
            color: var(--accent);
            font-weight: 500;
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-top: 2.5rem;
            animation: fadeUp 0.7s 0.3s ease both;
            letter-spacing: 0.05em;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            border-bottom: 1px solid currentColor;
            opacity: 0.7;
            transition: opacity var(--transition);
        }

        .footer a:hover { opacity: 1; }

        /* Animations */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 540px) {
            body { padding: 1rem 0.75rem 3rem; }
            .header { padding: 2rem 0 1.5rem; }
            .card { padding: 1.2rem; }
            .button-row { flex-direction: column; }
            .btn-primary { min-width: unset; }
            .stats-bar { gap: 1rem; flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="badge">AI-Powered NLP</div>
            <h1>Dialogue<br><span>Summarizer</span></h1>
            <p class="subtitle">// using HuggingFace T5 Transformer &mdash; paste content, get instant summaries</p>
        </div>

        <div class="divider"></div>

        <div class="card" style="animation-delay: 0.05s">
            <div class="card-label">Input</div>
            <form id="summarization-form">
                <textarea
                    id="dialogue-input"
                    placeholder="Enter your content here — dialogue, article, conversation transcript..."
                    required
                    maxlength="5000"
                ></textarea>
                <div class="char-counter"><span id="char-count">0</span> / 5000</div>

                <div class="button-row">
                    <button type="submit" class="btn-primary" id="submit-btn">
                        Summarize →
                    </button>
                    <button type="button" class="btn-secondary" id="clear-btn">
                        Clear
                    </button>
                </div>
            </form>
        </div>

        <div class="output-card" id="output-card">
            <div class="output-header">
                <div class="output-title">Summary</div>
                <button class="copy-btn" id="copy-btn">Copy</button>
            </div>
            <div class="output-body">
                <p id="summary-text"></p>
            </div>
            <div class="stats-bar" id="stats-bar" style="display:none">
                <div class="stat">
                    <span class="stat-label">Original</span>
                    <span class="stat-value" id="stat-original">—</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Summary</span>
                    <span class="stat-value" id="stat-summary">—</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Reduction</span>
                    <span class="stat-value" id="stat-reduction">—</span>
                </div>
            </div>
        </div>

        <div class="footer">
            Built with HuggingFace T5 &mdash; responses are AI-generated and may vary
        </div>

    </div>

    <script>
        const textarea = document.getElementById('dialogue-input');
        const charCount = document.getElementById('char-count');
        const charCounter = charCount.parentElement;
        const form = document.getElementById('summarization-form');
        const submitBtn = document.getElementById('submit-btn');
        const clearBtn = document.getElementById('clear-btn');
        const outputCard = document.getElementById('output-card');
        const summaryText = document.getElementById('summary-text');
        const copyBtn = document.getElementById('copy-btn');
        const statsBar = document.getElementById('stats-bar');

        // Char counter
        textarea.addEventListener('input', () => {
            const len = textarea.value.length;
            charCount.textContent = len;
            charCounter.classList.toggle('warn', len > 4000);
        });

        // Clear
        clearBtn.addEventListener('click', () => {
            textarea.value = '';
            charCount.textContent = '0';
            charCounter.classList.remove('warn');
            outputCard.classList.remove('visible');
            summaryText.style.color = '';
            textarea.focus();
        });

        // Copy
        copyBtn.addEventListener('click', () => {
            const text = summaryText.textContent;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                copyBtn.textContent = 'Copied!';
                setTimeout(() => copyBtn.textContent = 'Copy', 1800);
            });
        });

        // Submit — calls your backend /summarize/ endpoint
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const dialogue = textarea.value.trim();
            if (!dialogue) return;

            // Loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="btn-loading"><span class="spinner"></span>Summarizing...</span>`;
            outputCard.classList.add('visible');
            summaryText.textContent = '';
            summaryText.style.color = '';
            summaryText.classList.add('typing-cursor');
            statsBar.style.display = 'none';

            try {
                const response = await fetch('/summarize/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dialogue }),
                });

                if (!response.ok) throw new Error(`Server error: ${response.status}`);

                const data = await response.json();
                const summary = data.summary || 'No summary returned.';

                // Typewriter effect
                summaryText.textContent = '';
                let i = 0;
                const type = () => {
                    if (i < summary.length) {
                        summaryText.textContent += summary[i++];
                        setTimeout(type, 12);
                    } else {
                        summaryText.classList.remove('typing-cursor');
                        // Stats
                        const origWords = dialogue.split(/\s+/).length;
                        const sumWords = summary.split(/\s+/).length;
                        const reduction = Math.round((1 - sumWords / origWords) * 100);
                        document.getElementById('stat-original').textContent = origWords + ' words';
                        document.getElementById('stat-summary').textContent = sumWords + ' words';
                        document.getElementById('stat-reduction').textContent = reduction + '%';
                        statsBar.style.display = 'flex';
                    }
                };
                type();

            } catch (err) {
                summaryText.classList.remove('typing-cursor');
                summaryText.textContent = `⚠ Error: ${err.message}`;
                summaryText.style.color = '#f5a623';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Summarize →';
            }
        });
    </script>
</body>
</html>
